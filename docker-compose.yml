services:
  cardioshield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardioshield-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CARDIOSHIELD_SECRET_KEY=cardioshield-production-secure-passphrase-change-in-prod
      - CARDIOSHIELD_API_KEY=cardioshield-default-api-key
      - CARDIOSHIELD_PORT=8000
      - CARDIOSHIELD_HOST=0.0.0.0
    volumes:
      - cardioshield-data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  cardioshield-data:
    name: cardioshield-db-data
